# ==================================================
# SERVER CONFIGURATION
# ==================================================
server.servlet.context-path=/events
server.port=8089

# ==================================================
# DATABASE CONFIGURATION (MYSQL / KUBERNETES)
# ==================================================
spring.datasource.url=jdbc:mysql://mysql:3306/eventsProject?createDatabaseIfNotExist=true&useUnicode=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==================================================
# JPA / HIBERNATE
# ==================================================
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL5Dialect
spring.jpa.properties.hibernate.format_sql=true

# ==================================================
# DATE FORMAT
# ==================================================
spring.mvc.format.date=yyyy-MM-dd

# ==================================================
# LOGGING
# ==================================================
logging.level.root=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %-5level- %logger{45} - %msg%n
